services:
  engine:
    build: .
    ports:
      - "8080:8080"
    env_file: .env.local
    environment:
      ConnectionStrings__Postgres: "Host=db;Database=omnitrade;Username=postgres;Password=dev"
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: omnitrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: