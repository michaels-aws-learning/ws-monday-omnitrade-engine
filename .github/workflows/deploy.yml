name: Build and Deploy C# Web API to AWS

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # --- Build and test the application ---
      - name: Restore and Build OmniTrade Solution
        run: |
          dotnet restore app/OmniTrade.slnx
          dotnet build app/OmniTrade.slnx --configuration Release --no-restore

      - name: Test OmniTrade Solution
        run: dotnet test app/OmniTrade.slnx --configuration Release --no-build

      # --- Validate the container image builds (CDK rebuilds and pushes it during deploy) ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 Docker image
        run: docker buildx build --platform linux/arm64 --tag omnitrade-engine:${GITHUB_SHA} app

      # --- Validate the CDK app compiles ---
      - name: Restore & Build Infra
        run: |
          dotnet restore infra/src/
          dotnet build infra/src/ --configuration Release --no-restore

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # Required so GitHub can issue an OIDC token that AWS will trust
    permissions:
      id-token: write
      contents: read

    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The CDK app is C#, so cdk deploy needs the .NET 10 SDK on this runner too
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # CDK builds the ARM64 image from the Dockerfile via ContainerImage.FromAsset
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      - name: Resolve AWS account ID
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      # --- Install CDK and Deploy ---
      - name: Install AWS CDK
        run: npm install -g aws-cdk


      - name: Deploy Infrastructure with CDK
        run: |
          cd infra/
          cdk deploy --all --require-approval never --no-notices \
          --context accountId=${{ 'deprecated' }} \
          --context env=${{ env.ENV_NAME }} \
          --context authority=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context audience=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context apiaudience=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context auth0url=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context dbcredentials=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context corsOrigins=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context s3bucketname=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context documentsbucketname=${{ github.ref == 'refs/heads/main' && 'm' || '' }} \
          --context eventBusName=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context anthropicApiKey=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context kmsKeyArn=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context kmsKeyId=${{ github.ref == 'refs/heads/main' && '' || '' }}