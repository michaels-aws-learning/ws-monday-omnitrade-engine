name: Build and Deploy C# Web API to AWS

on:
  push:
    branches:
      - development
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.x'

      # --- Build the application and container image ---
      - name: Restore and Build OmniTrade Solution
        run: |
          dotnet restore app/OmniTrade.slnx
          dotnet build app/OmniTrade.slnx --configuration Release --no-restore

      - name: Build ARM64 Docker image
        run: docker buildx build --platform linux/arm64 --tag omnitrade-engine:${GITHUB_SHA} --load app

      # --- Build Infra (CDK) ---
      - name: Restore & Build Infra
        run: |
          dotnet restore infra/src/
          dotnet build infra/src/ --configuration Release

      - name: Upload Infra Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infra-build
          path: infra/src/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: ${{ github.ref == 'refs/heads/main' && 'mallient-verify-ui-bucket-prod' || 'mallient-verify-ui-bucket-dev' }}
      AWS_ACCOUNT_ID: ${{ github.ref == 'refs/heads/development' && secrets.DEV_AWS_ACCOUNT_ID || secrets.PROD_AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Download infrastructure build artifacts ---
      - name: Download Infra Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: infra-build
          path: infra/src/

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64;p=sys.argv[1].split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ('sub','aud','repository','ref')},indent=2))" "$TOKEN"

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && vars.AWS_PROD_ROLE_ARN || vars.AWS_DEV_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 3

      # --- Install CDK and Deploy ---
      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Bootstrap AWS CDK (if needed)
        run: cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: Deploy Infrastructure with CDK
        run: |
          cd infra/
          cdk deploy --all --require-approval never --no-notices \
          --context accountId=${{ env.AWS_ACCOUNT_ID }} \
          --context env=${{ github.ref == 'refs/heads/development' && 'development' || 'production' }} \
          --context authority=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context audience=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context apiaudience=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context auth0url=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context dbcredentials=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context corsOrigins=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context s3bucketname=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context documentsbucketname=${{ github.ref == 'refs/heads/main' && 'm' || '' }} \
          --context eventBusName=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context anthropicApiKey=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context kmsKeyArn=${{ github.ref == 'refs/heads/main' && '' || '' }} \
          --context kmsKeyId=${{ github.ref == 'refs/heads/main' && '' || '' }}